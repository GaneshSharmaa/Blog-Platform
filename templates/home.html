{% extends "layout.html" %}

{% block content %}

<div class="hero-section text-center">

    <h1 class="hero-title">
        Latest Posts
    </h1>

    <p class="hero-subtitle">
        Thoughts, ideas and updates
    </p>

</div>


{% for post in posts %}

<article class="content-section">

    <div class="post-header d-flex align-items-center mb-3">
        <img
            src="{{ post.author.image_path }}"
            alt="{{ post.author }}'s avatar"
            class="post-avatar me-3"
            style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover;"
        >

        <div class="post-meta">
            <div class="post-author small text-muted" href="{{ url_for('user_posts', user_id = post.author.id) }}">{{ post.author.username }}</div>
            <small class="article-meta">{{ post.date_posted.strftime('%B %d, %Y') }}</small>
        </div>
    </div>

    <h2 class="h3 fw-bold mb-3">

        <a href="{{ url_for('post_page', post_id = post.id) }}" class="article-title">
            {{ post.title }}
        </a>

    </h2>

    <p class="article-content mb-0">
        {{ post.content }}
    </p>

</article>

{% endfor %}
{% endblock content %}
