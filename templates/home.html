{% extends "layout.html" %}

{% block content %}

<div class="hero-section text-center">

    <h1 class="hero-title">
        Latest Posts
    </h1>

    <p class="hero-subtitle">
        Thoughts, ideas and updates
    </p>

</div>


{% for post in posts %}

<article class="content-section">

    <div class="post-header d-flex align-items-center mb-3">
        <img
            src="{{ post.profile_pic if post.profile_pic else ('https://ui-avatars.com/api/?name=' + post.author.replace(' ', '+') + '&background=random&size=128') }}"
            alt="{{ post.author }}'s avatar"
            class="post-avatar me-3"
            style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover;"
        >

        <div class="post-meta">
            <div class="post-author small text-muted">{{ post.author }}</div>
            <small class="article-meta">{{ post.date_posted }}</small>
        </div>
    </div>

    <h2 class="h3 fw-bold mb-3">

        <a href="#" class="article-title">
            {{ post.title }}
        </a>

    </h2>

    <p class="article-content mb-0">
        {{ post.content }}
    </p>

</article>

{% endfor %}
{% endblock content %}
