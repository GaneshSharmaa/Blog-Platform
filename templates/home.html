{% extends "layout.html" %}

{% block content %}

<div class="mb-5 text-center">
    <h1 class="fw-bold">Latest Posts</h1>
    <p class="text-muted">
        Thoughts, ideas and updates from the blog
    </p>
</div>

{% for post in posts %}

<article class="content-section p-4 mb-4">

    <div class="d-flex justify-content-between align-items-center mb-2">

        <span class="badge bg-primary">
            {{ post.author }}
        </span>

        <small class="article-meta">
            {{ post.date_posted }}
        </small>

    </div>

    <h2 class="h3 fw-bold mb-3">
        <a href="#" class="article-title">
            {{ post.title }}
        </a>
    </h2>

    <p class="text-secondary mb-0">
        {{ post.content }}
    </p>

</article>

{% endfor %}

{% endblock content %}
