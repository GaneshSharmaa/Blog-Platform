<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% if title %}
            {{ title }} — FastAPI Blog
        {% else %}
            FastAPI Blog
        {% endif %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/main.css') }}"
    >
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">
                FastAPI Blog
            </a>

            <div class="navbar-actions ms-auto d-flex gap-2">
                <!-- New Post button -->
                <button class="btn btn-outline-light mb-2 mb-md-0 me-md-2"
                    type="button"
                    data-bs-toggle="modal"
                    data-bs-target="#createPostModal"
                >
                    New Post
                </button>

                <!-- Login button -->
                <a class="btn btn-outline-light btn-sm" href="/login">
                    Login
                </a>

                <!-- Register button -->
                <a class="btn btn-warning btn-sm" href="/register">
                    Register
                </a>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                {% block content %}
                {% endblock content %}
            </div>
        </div>
    </main>

    <footer class="border-top bg-white py-4 mt-auto">
        <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between gap-2">
            <p class="mb-0 text-muted">
                <span id="footer-year"></span> FastAPI Blog. Built with FastAPI and Bootstrap.
            </p>

            <div class="d-flex gap-3">
                <a class="text-decoration-none text-muted" href="/login">Login</a>
                <a class="text-decoration-none text-muted" href="/register">Register</a>
            </div>
        </div>
    </footer>

    <!-- Create Post Modal -->
    <div class="modal fade"
        id="createPostModal"
        tabindex="-1"
        aria-labelledby="createPostModalLabel"
        aria-hidden="true">

        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createPostModalLabel">New Post</h5>
                    <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                
                <form id="createPostForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label">Content</label>
                            <textarea class="form-control" id="content" name="content" rows="5" required></textarea>
                        </div>

                        <div class="modal-footer">
                            <button type="button"
                                class="btn btn-outline-secondary"
                                data-bs-dismiss="modal">Cancel</button>
                            
                            <button type="submit" class="btn btn-primary">Post</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade"
            id="successModal"
            tabindex="-1"
            aria-labelledby="successModalLabel"
            aria-hidden="true">
        <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
            <h5 class="modal-title" id="successModalLabel">Success</h5>
            <button type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body">
            <p id="successMessage" class="fs-5"></p>
            </div>
            <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
        </div>
    </div>

    <!-- Error Modal -->
    <div class="modal fade"
            id="errorModal"
            tabindex="-1"
            aria-labelledby="errorModalLabel"
            aria-hidden="true">
        <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
            <h5 class="modal-title" id="errorModalLabel">Error</h5>
            <button type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body">
            <p id="errorMessage" class="fs-5"></p>
            </div>
            <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const footerYear = document.getElementById("footer-year");

            if (footerYear) {
                footerYear.textContent = new Date().getFullYear();
            }
        });
    </script>
</body>
</html>
