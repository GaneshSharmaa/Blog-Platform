{% extends "layout.html" %}

{% block content %}

<div class="hero-section text-center">

    <h1 class="hero-title">
        Latest Posts
    </h1>

    <p class="hero-subtitle">
        Thoughts, ideas and updates
    </p>

</div>


{% for post in posts %}

<article class="content-section">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <span class="badge bg-primary author-badge">
            {{ post.author }}
        </span>

        <small class="article-meta">
            {{ post.date_posted }}
        </small>

    </div>

    <h2 class="h3 fw-bold mb-3">

        <a href="#" class="article-title">
            {{ post.title }}
        </a>

    </h2>

    <p class="article-content mb-0">
        {{ post.content }}
    </p>

</article>

{% endfor %}
{% endblock content %}
